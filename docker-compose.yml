# Infraestructura de desarrollo de PartVision.
# Uso: docker compose up -d
services:
  db:
    image: postgres:16-alpine
    container_name: partvision-db
    environment:
      POSTGRES_DB: partvision
      POSTGRES_USER: partvision
      POSTGRES_PASSWORD: partvision
    ports:
      # Host 5442 para no chocar con un PostgreSQL nativo en 5432 ni con otras apps.
      - "5442:5432"
    volumes:
      - partvision-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U partvision -d partvision"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Object storage compatible con S3 (imagenes de productos, fases 6/7).
  storage:
    image: minio/minio:latest
    container_name: partvision-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"   # API S3
      - "9001:9001"   # Consola web
    volumes:
      - partvision-storage-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5

  # UI liviana para inspeccionar la base durante el desarrollo.
  adminer:
    image: adminer:latest
    container_name: partvision-adminer
    ports:
      - "8081:8080"
    depends_on:
      - db

volumes:
  partvision-db-data:
  partvision-storage-data:
