server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # API: reverse-proxy al backend. Para el navegador todo es UN SOLO ORIGEN (el del panel),
    # lo que permite la cookie HttpOnly + SameSite=Strict y el CSRF sin exponer CORS.
    # El entrypoint reemplaza __BACKEND_URL__/__BACKEND_HOST__ con la env BACKEND_URL en runtime.
    location /api/ {
        proxy_pass __BACKEND_URL__;
        proxy_http_version 1.1;
        # Render (y muchos PaaS) rutean por Host: hay que mandar el host del backend, no el del panel.
        proxy_set_header Host __BACKEND_HOST__;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # SPA: cualquier ruta cae en index.html (Angular router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # La config de runtime nunca se cachea (se reescribe por deploy).
    location = /env.js {
        add_header Cache-Control "no-store";
    }
}
