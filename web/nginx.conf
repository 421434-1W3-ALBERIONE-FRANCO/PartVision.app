server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # --- Cabeceras de seguridad (aplican a todas las respuestas; 'always' incluye errores) ---
    # nginx NO hereda add_header en una location que define su propio add_header (ver /env.js).
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # HSTS: fuerza HTTPS por 1 año (solo tiene efecto sobre https; en http lo ignora el navegador).
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    # CSP: todo desde el propio origen. script-src no usa 'unsafe-inline'; el unico handler inline
    # del build de Angular (onload="this.media='all'" para cargar el CSS) se habilita por hash.
    # style-src permite inline (Angular inyecta estilos de componente); las fuentes Inter vienen de
    # fonts.gstatic.com. La API es same-origin (/api via proxy), asi que connect-src 'self' alcanza.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-hashes' 'sha256-MhtPZXr7+LpJUY5qtMutB+qWfQtMaPccfe7QXtCcEYc='; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;

    # API: reverse-proxy al backend. Para el navegador todo es UN SOLO ORIGEN (el del panel),
    # lo que permite la cookie HttpOnly + SameSite=Strict y el CSRF sin exponer CORS.
    # El entrypoint reemplaza __BACKEND_URL__/__BACKEND_HOST__ con la env BACKEND_URL en runtime.
    location /api/ {
        proxy_pass __BACKEND_URL__;
        proxy_http_version 1.1;
        # Render (y muchos PaaS) rutean por Host: hay que mandar el host del backend, no el del panel.
        proxy_set_header Host __BACKEND_HOST__;
        proxy_ssl_server_name on;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 120s;
        proxy_read_timeout 120s;
        client_max_body_size 15m;
    }

    # SPA: cualquier ruta cae en index.html (Angular router).
    location / {
        try_files $uri $uri/ /index.html;
    }

    # La config de runtime nunca se cachea (se reescribe por deploy). Al definir su propio
    # add_header pierde los de arriba, asi que re-declaramos nosniff (el unico relevante para un .js).
    location = /env.js {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
