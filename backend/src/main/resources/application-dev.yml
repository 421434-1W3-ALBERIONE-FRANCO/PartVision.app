# Perfil de desarrollo local (apunta al docker-compose de la raiz del repo).
spring:
  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true

logging:
  level:
    org.hibernate.SQL: debug
    org.flywaydb: info
    com.partvision: debug

management:
  endpoint:
    health:
      show-details: always
