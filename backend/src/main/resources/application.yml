spring:
  application:
    name: partvision
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5442/partvision}
    username: ${DB_USERNAME:partvision}
    password: ${DB_PASSWORD:partvision}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gobierna Flyway; Hibernate solo valida contra el.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

security:
  jwt:
    # En produccion definir SIEMPRE JWT_SECRET (>=32 bytes). El default es solo para desarrollo.
    secret: ${JWT_SECRET:dev-secret-cambiar-en-produccion-0123456789abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    # Origenes del panel web permitidos (coma-separado). Dev: Angular en 4200.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

ai:
  vision:
    # "stub" (no llama a ninguna IA, devuelve null) o "claude" (API real de Anthropic).
    provider: ${AI_VISION_PROVIDER:stub}
    # Modelo de vision cuando provider=claude. Podés usar uno más barato (ej: claude-haiku-4-5).
    model: ${AI_VISION_MODEL:claude-opus-5}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
