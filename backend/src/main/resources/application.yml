spring:
  application:
    name: partvision
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5442/partvision}
    username: ${DB_USERNAME:partvision}
    password: ${DB_PASSWORD:partvision}
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gobierna Flyway; Hibernate solo valida contra el.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

security:
  jwt:
    # En produccion definir SIEMPRE JWT_SECRET (>=32 bytes). El default es solo para desarrollo.
    secret: ${JWT_SECRET:dev-secret-cambiar-en-produccion-0123456789abcdef}
    expiration-ms: ${JWT_EXPIRATION_MS:3600000}
  cors:
    # Origenes del panel web permitidos (coma-separado). Dev: Angular en 4200.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

ai:
  vision:
    # Proveedor de vision: "stub" (no llama a ninguna IA, devuelve null),
    # "claude" (Anthropic), "openai" (OpenAI) o "gemini" (Google, con nivel gratuito).
    # Requiere la API key del proveedor elegido (ANTHROPIC/OPENAI/GEMINI_API_KEY).
    provider: ${AI_VISION_PROVIDER:stub}
    # Modelo: NO se fija un default acá a proposito. El env AI_VISION_MODEL lo sobreescribe
    # (relaxed binding); si no se define, cada proveedor aplica su propio default
    # (claude-opus-5 para claude, gpt-4o para openai). Fijar uno aca forzaria un modelo
    # de un proveedor sobre el otro.

springdoc:
  swagger-ui:
    path: /swagger-ui.html
