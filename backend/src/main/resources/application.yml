spring:
  application:
    name: partvision
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5442/partvision}
    username: ${DB_USERNAME:partvision}
    password: ${DB_PASSWORD:partvision}
    hikari:
      data-source-properties:
        # Reescribe los INSERT en lote a un unico multi-row INSERT: acelera la importacion masiva.
        reWriteBatchedInserts: true
  jpa:
    open-in-view: false
    hibernate:
      # El esquema lo gobierna Flyway; Hibernate solo valida contra el.
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
    test-connection: false

partvision:
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:noreply@partvision.com}}
    base-url: ${APP_BASE_URL:http://localhost:4200}
  proveedor:
    url: ${PROVEEDOR_API_URL:https://catalogo.autopartesdelsur.com.ar}
    username: ${PROVEEDOR_API_USERNAME:}
    password: ${PROVEEDOR_API_PASSWORD:}
    margen: ${PROVEEDOR_MARGEN:22.5}
  recovery:
    token-expiration-minutes: ${RECOVERY_TOKEN_EXPIRATION_MINUTES:30}
  servlet:
    multipart:
      # Fotos de repuestos desde el celular: el default de 1MB es muy chico.
      max-file-size: 15MB
      max-request-size: 15MB

security:
  jwt:
    # En produccion definir SIEMPRE JWT_SECRET (>=32 bytes). El default es solo para desarrollo.
    secret: ${JWT_SECRET:dev-secret-cambiar-en-produccion-0123456789abcdef}
    # 12 horas: cubre una jornada de deposito sin re-login. Override con JWT_EXPIRATION_MS.
    expiration-ms: ${JWT_EXPIRATION_MS:43200000}
  cors:
    # Origenes del panel web permitidos (coma-separado). Dev: Angular en 4200.
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200}
  cookie:
    # Cookie HttpOnly que transporta el JWT en el panel web.
    name: ${AUTH_COOKIE_NAME:pv_token}
    # PROD (https, panel y API bajo el mismo dominio via proxy nginx): secure=true.
    # DEV (http localhost): DEBE ser false o el navegador descarta la cookie.
    secure: ${AUTH_COOKIE_SECURE:false}
    # Strict con proxy mismo-dominio (Opcion A). Si algun dia el panel y la API quedan
    # en dominios distintos, hay que pasar a None (y secure=true).
    same-site: ${AUTH_COOKIE_SAMESITE:Strict}
  rate-limit:
    login:
      # Anti fuerza-bruta en POST /auth/login: N intentos por IP por ventana.
      capacity: ${LOGIN_RATE_LIMIT_CAPACITY:5}
      refill-minutes: ${LOGIN_RATE_LIMIT_MINUTES:1}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

ai:
  vision:
    # Proveedor de vision: "stub" (no llama a ninguna IA, devuelve null),
    # "claude" (Anthropic), "openai" (OpenAI) o "gemini" (Google, con nivel gratuito).
    # Requiere la API key del proveedor elegido (ANTHROPIC/OPENAI/GEMINI_API_KEY).
    provider: ${AI_VISION_PROVIDER:stub}
    # Modelo: NO se fija un default acá a proposito. El env AI_VISION_MODEL lo sobreescribe
    # (relaxed binding); si no se define, cada proveedor aplica su propio default
    # (claude-opus-5 para claude, gpt-4o para openai). Fijar uno aca forzaria un modelo
    # de un proveedor sobre el otro.

springdoc:
  swagger-ui:
    path: /swagger-ui.html
