name: partvision_mobile
description: App mobile de PartVision para operarios (escaneo, IA, carga manual, busqueda).
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  flutter_secure_storage: ^9.2.2
  mobile_scanner: ^5.2.3
  image_picker: ^1.1.2
  http_parser: ^4.0.2

dev_dependencies:
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
